[project]
# site_url = "https://www.example.com/"
site_name = "SAR Correlation ToolKit"
# site_description = "Your project description"
site_author = "Leo Letellier"

copyright = "Copyright &copy; 2026 Leo Letellier"

docs_dir = "docs"

repo_url = "https://github.com/LeoLetellier/ASP-SAR"
repo_name = "ASP-SAR"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Pixel Tracking Workflow" = "workflow.md" },
  {"AMSTer" = "amster.md"},
  {"Network" = "network.md"},
  {"Plots" = "plots.md"},
  {"Raster" = "raster.md"},
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

[project.theme.icon]
logo = "lucide/orbit"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "orange"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "orange"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "orange"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LeoLetellier"

[[project.extra.social]]
icon = "fontawesome/brands/codeberg"
link = "https://codeberg.org/LeoLetellier"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "."
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Docstrings
[project.plugins.mkdocstrings.handlers.python]
paths = [".", "amster", "raster_more", "utils", "workflow"]
inventories = ["https://docs.python.org/3/objects.inv"]  # for cross-refs to stdlib/deps

[project.plugins.mkdocstrings.handlers.python.options]
# docstring_style = "numpy"
docstring_section_style = "table"    # sections rendering (table/list/spacy)
filters = "public"                   # which members to keep after collection
heading_level = 2                    # starting heading level for the root rendered object — default: 2
members_order = "source"             # rendering order (alphabetical/source/__all__)
merge_init_into_class = true         # fold __init__'s docstring/signature into the class doc
inherited_members = true             # members inherited from base classes
extensions = ["griffe_inherited_docstrings"]  # Griffe extensions to load (must be installed)
parameter_headings = true            # give each parameter its own heading (enables deep-linking to params)
separate_signature = true            # render the signature in its own code block instead of inline with the heading
show_root_heading = true             # show a heading for the object the page/`:::` was invoked on
show_root_full_path = false          # use the short name instead of the full dotted path in that root heading
show_signature_annotations = true    # show type annotations in signatures
show_source = true                   # add a collapsible "view source" block under each object
show_submodules = false              # recurse into and document submodules automatically
show_symbol_type_heading = true      # prefix headings with a little "class"/"function"/etc. badge
show_symbol_type_toc = true          # same badge, but in the page's table of contents
signature_crossrefs = true           # turn types inside signatures into clickable cross-references
summary = true                       # add auto-generated summary tables (modules/classes/functions/attrs)

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true           # drop the first line of __init__'s docstring
